<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에너닷 온보딩 발전량 레이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F3F6F9; --line:#DDE3E9; --ink:#0E1E2C; --ink2:#3F4D5A; --muted:#6E7A86;
  --blue:#0975D0; --blue-soft:#E6F1FB; --green:#00AE77; --green-ink:#00865C; --green-soft:#E2F6EF;
  --warn:#B4690E; --warn-soft:#FBF0E1; --on-brand:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1E2C; --surface:#152838; --line:#24394B; --ink:#EEF3F7; --ink2:#C3CED8; --muted:#8C9BA8;
    --blue:#3D97E6; --blue-soft:#14314B; --green:#1FC48D; --green-ink:#3FD39F; --green-soft:#12362E;
    --warn:#F0A54A; --warn-soft:#352717; --on-brand:#FFFFFF; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1E2C; --surface:#152838; --line:#24394B; --ink:#EEF3F7; --ink2:#C3CED8; --muted:#8C9BA8;
  --blue:#3D97E6; --blue-soft:#14314B; --green:#1FC48D; --green-ink:#3FD39F; --green-soft:#12362E;
  --warn:#F0A54A; --warn-soft:#352717; --on-brand:#FFFFFF; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

.wrap{max-width:620px;margin:0 auto;padding:0 20px 56px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
header::after{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--green) 50% 100%)}
.bar{max-width:620px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{height:22px;width:auto;display:block}
.logo.dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.light{display:none}:root:not([data-theme="light"]) .logo.dark{display:block}}
:root[data-theme="dark"] .logo.light{display:none}
:root[data-theme="dark"] .logo.dark{display:block}
.bar .tag{font-size:14px;color:var(--muted);font-weight:500}

/* intro */
.intro{padding:44px 0 24px;position:relative}
.intro .sym{width:72px;height:auto;display:block;margin-bottom:28px}
.intro .clock{font-size:clamp(64px,18vw,104px);font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--ink);display:flex;align-items:center;gap:.12em}
.intro .clock .dot{width:.2em;height:.2em;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.intro h1{font-size:28px;line-height:1.3;margin:24px 0 10px;letter-spacing:-.02em}
.intro p{color:var(--ink2);margin:0 0 28px;max-width:34em}
label.field{display:block;font-size:14px;color:var(--ink2);margin-bottom:6px}
input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=text]:focus{outline:none;border-color:var(--blue)}
.btn{display:flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:12px;border:0;background:#0975D0;color:#FFFFFF;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:active{transform:translateY(1px)}
.note{font-size:14px;color:var(--muted);margin-top:16px}

/* timeline */
.track{position:relative;margin:20px 0 8px;height:40px}
.track .line{position:absolute;left:12px;right:12px;top:33px;height:2px;background:var(--line)}
.track .fill{position:absolute;left:12px;top:33px;height:2px;background:var(--blue);transition:width .6s ease}
.track .tick{position:absolute;top:30px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--line)}
.track .flag{position:absolute;top:6px;width:18px;height:30px;margin-left:-2px;overflow:visible}
.track .flag .pole{stroke:var(--ink)}
.me .leg{transform-origin:11px 19px}
.me .arm{transform-origin:13.4px 11px}
.me .leg.a{transform:rotate(-14deg)}
.me .leg.b{transform:rotate(18deg)}
.me .arm.a{transform:rotate(20deg)}
.me .arm.b{transform:rotate(-20deg)}
.me.run .leg.a,.me.run .arm.b{animation:swing .16s ease-in-out infinite alternate}
.me.run .leg.b,.me.run .arm.a{animation:swing .16s ease-in-out infinite alternate-reverse}
.me.run svg{animation:bob .08s ease-in-out infinite alternate}
.me.jump svg{animation:hop .5s ease-out}
@keyframes swing{from{transform:rotate(-38deg)}to{transform:rotate(38deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-10px)}60%{transform:translateY(0)}75%{transform:translateY(-3px)}}
.track .tick.ok{background:var(--green)}
.track .tick.no{background:var(--warn)}
.track .me{position:absolute;top:2px;width:24px;height:32px;margin-left:-13px;transition:left .6s cubic-bezier(.4,.1,.2,1)}
.track .me svg{display:block;width:24px;height:32px;overflow:visible}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meta .kwh{color:var(--green-ink);font-weight:700}

.scene{padding-top:28px}
.when{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.when .t{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.when .p{color:var(--blue);font-weight:500}
.scene .q{font-size:20px;line-height:1.5;font-weight:500;margin:18px 0 22px;letter-spacing:-.01em}
.choices{display:grid;gap:10px}
.choice{text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;line-height:1.5}
.choice:hover:not([disabled]){border-color:var(--blue)}
.choice[disabled]{cursor:default}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice.wrong{border-color:var(--warn);background:var(--warn-soft)}
.choice.dim{opacity:.5}
.fb{margin-top:18px;padding:18px;border-radius:12px;background:var(--surface);border-left:4px solid var(--green)}
.fb.no{border-left-color:var(--warn)}
.fb strong{display:block;margin-bottom:6px}
.fb.ok strong{color:var(--green-ink)}
.fb.no strong{color:var(--warn)}
.fb p{margin:0;color:var(--ink2)}

/* result */
.result{padding-top:36px}
.charge{position:relative;width:132px;margin-bottom:28px}
.charge img{display:block;width:100%;height:auto}
.charge .base{filter:grayscale(1);opacity:.18}
.charge .lit{position:absolute;inset:0;clip-path:inset(100% 0 0 0);transition:clip-path 1.4s cubic-bezier(.3,.1,.2,1)}
.result .big{font-size:clamp(56px,16vw,88px);font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--ink)}
.result .big small{font-size:.32em;color:var(--green-ink);font-weight:700;letter-spacing:0;margin-left:6px}
.result .unit{color:var(--ink2);margin-top:8px}
.result h2{font-size:24px;margin:28px 0 6px;letter-spacing:-.02em;color:var(--blue)}
.result .lead{color:var(--ink2);margin:0}
.review{margin-top:32px}
.review h3{font-size:17px;margin:0 0 12px}
.review ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.review li{padding:14px 16px;border-left:3px solid var(--warn);background:var(--surface);border-radius:0 10px 10px 0}
.review li b{display:block;font-size:14px;color:var(--ink2);font-weight:500;margin-bottom:4px}
.review li p{margin:0;font-size:15px}
.result .btn{margin-top:28px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  w:"메시지는 끊지 않고 한 번에, 명확하고 간결하게 보내요. 업무 이야기는 공용 메신저인 잔디에서 나눠요. 요청을 받으면 빠르게 회신하는 것도 잊지 마세요."},
 {t:"11:55", p:"내 자리", q:"점심 먹으러 일어나요. 모니터에는 고객 발전소 자료가 열려 있어요.",
  c:["금방 돌아오니까 그대로 둔다","화면을 잠그고 나간다","창만 최소화해 둔다"], a:1,
  w:"자리를 비울 때는 화면을 잠가요. 오래 비우면 컴퓨터와 모니터를 절전 모드로 바꿔요. 고객정보와 내부정보는 외부에 공유하지 않아요."},
 {t:"12:10", p:"엘리베이터 앞", q:"다른 팀 사람들과도 친해지고 싶어요. 에너닷엔 어떤 자리가 있을까요?",
  c:["에너밥: 매월 랜덤으로 다른 팀원과 점심","타운홀데이: 분기별 주제로 모이는 미팅","둘 다 있다"], a:2,
  w:"에너밥은 매월 랜덤으로 다른 팀원과 점심을 먹는 자리, 타운홀데이는 분기마다 주제를 정해 모이는 자리예요. 온보딩 3개월 동안 에너밥에 최소 한 번은 참여해 보세요. 사내동호회 활동비도 지원돼요."},
 {t:"13:30", p:"탕비실", q:"편의점에서 사 온 음료를 냉장고에 넣으려고 해요.",
  c:["그냥 넣어둔다","이름을 붙여서 넣는다","라운지 테이블에 올려둔다"], a:1,
  w:"냉장고 물품에는 이름을 붙여요. 탕비실은 쓰고 나서 바로 정리하고, 라운지에서 식사했다면 환기와 뒷정리까지 해요."},
 {t:"14:10", p:"내 자리", q:"Excel에 로그인하고 싶은데 계정을 몰라요. 누구에게 물어볼까요?",
  c:["Genie (CoS)","Henry (CoS)","Beeny (CoS)","팀장님"], a:1,
  w:"계정·기기·접근 권한과 출입·시설·비품은 Henry, 근태·휴가·복리후생은 Genie, 비용은 멘토나 Beeny에게 물어봐요. 담당 업무와 우선순위는 그룹장이나 팀장님께요."},
 {t:"14:50", p:"JANDI", q:"차를 가지고 온 외부 손님이 미팅을 마치고 곧 출발하신대요. 주차는 어떻게 할까요?",
  c:["손님이 도착했을 때 미리 할인 등록을 해뒀어야 한다","잔디 [에너닷_주차등록] 토픽에 지금 요청한다","건물 주차가 무료라 할 일이 없다"], a:1,
  w:"방문객 주차 등록은 잔디 [에너닷_주차등록] 토픽에 요청해요. 사전 할인 등록은 안 되니, 출차 예정 5~10분 전에 요청하면 딱 좋아요. 직원은 건물 내 무료 주차 지원이 없어요."},
 {t:"15:30", p:"Gmail", q:"‘[긴급] 아래 링크에서 계정 비밀번호를 다시 확인해 주세요’라는 메일이 왔어요. 보낸 주소가 낯설어요.",
  c:["급하다니 일단 링크를 눌러 확인한다","개인 메일로 옮겨 두고 나중에 본다","링크를 누르지 않고 즉시 신고한다"], a:2,
  w:"의심스러운 메일과 링크는 열지 말고 바로 신고해요. 계정과 비밀번호는 누구와도 공유하지 않고, 회사 자료는 개인 메일이나 개인 저장공간으로 보내지 않아요."},
 {t:"16:10", p:"14층", q:"비상방송이 울려요. (오늘은 훈련 상황이에요)",
  c:["엘리베이터를 타고 빠르게 내려간다","낮은 자세로, 미리 확인해 둔 계단과 비상구로 대피한다","자리에서 다음 안내를 기다린다"], a:1,
  w:"비상방송이 나오면 낮은 자세로 대피해요. 계단과 출구, 소화기 위치는 미리 확인해 두고, 사고나 응급 상황은 내부 연락망과 119로 알려요."},
 {t:"16:40", p:"Flex", q:"나중에 연차를 쓰고 싶어요. 어떻게 할까요?",
  c:["리더에게 먼저 승인을 받는다","Flex 대시보드 ‘휴가 등록’에서 종류와 날짜를 골라 등록한다","Genie에게 휴가 신청서를 보낸다"], a:1,
  w:"휴가는 승인 절차 없이 Flex에서 등록해요. 대신 맡은 일에 책임감을 갖고 써요. 연차는 입사일 기준 한 달 만근하면 1개씩 생겨요. 외근·출장은 반대로 Flex에 일정을 만든 뒤 리더 승인을 받아요."},
 {t:"17:10", p:"라운지", q:"다음 달이 내 생일이에요. 에너닷에서는…",
  c:["생일 당일에만 반차를 쓸 수 있다","생일 전후 7일 안에 생일특별반차를 쓸 수 있다","따로 챙기는 건 없다"], a:1,
  w:"생일특별반차는 생일 전후 7일 이내에 쓸 수 있어요. 경조사 지원, 교육·도서, 자격 취득 지원, 만 3·6·9년 리프레시휴가도 있으니 에너닷 생활백서에서 확인해 보세요."},
 {t:"17:40", p:"내 자리", q:"첫날을 돌아보니 잘한 것도, 아쉬운 것도 있었어요. 에너닷다운 마무리는?",
  c:["아쉬운 건 잊고 내일 새로 시작한다","좋았던 점은 이어가고, 아쉬운 점은 어떻게 개선할지 적어둔다","멘토가 피드백을 줄 때까지 기다린다"], a:1,
  w:"에너닷이 일하는 방식 중 하나가 ‘회고는 성장을 위한 필수 과정’이에요. 나머지 둘은 ‘주체적인 사고와 책임감’, ‘서로에게 최고의 동료’예요."},
 {t:"18:50", p:"사무실", q:"정신 차려보니 사무실에 나만 남았어요. 내일은 공휴일이에요.",
  c:["불만 끄고 나간다","전원을 끄고 출입 경계를 설정하고, 방범 설정까지 하고 나간다","문만 잠그고 나간다"], a:1,
  w:"마지막 퇴근자는 전원을 끄고 출입 경계를 설정해요. 다음 날이 공휴일이면 방범 설정도 해요. 책상 위 문서와 기기도 정리하고 퇴근해요."},
 {t:"21:30", p:"집", q:"소파에 누웠는데 멘토에게 물어볼 게 떠올랐어요.",
  c:["잊기 전에 지금 바로 잔디로 보낸다","메모해 두고 내일 아침에 정리해서 보낸다"], a:1,
  w:"퇴근 후 메시지는 삼가고 동료의 개인 시간을 존중해요. 내일 아침, 정리해서 한 번에 보내면 돼요. 첫날 수고 많았어요!"}
];

const PER = 10, MAX = SCENES.length * PER;

const GRADES = [
  {min:1, t:"완벽 가동", d:"첫날부터 이미 에너닷 사람이네요. 내일 출근도 기대돼요!"},
  {min:.8, t:"안정 가동", d:"거의 다 알고 계세요. 아래 놓친 부분만 한 번 더 확인하면 충분해요."},
  {min:.5, t:"시운전 중", d:"첫날이니 괜찮아요. 놓친 부분을 읽어보고 한 번 더 해보면 금방 익숙해져요."},
  {min:0, t:"점검이 필요해요", d:"오리엔테이션 자료와 에너닷 생활백서를 훑어본 뒤 다시 도전해 보세요."}
];

const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};

const P = document.getElementById("v-play");
let game = null;

function renderIntro(){
  const last = store.get("last", null);
  const name = el("input", {type:"text", id:"nm", autocomplete:"name", maxlength:"20", placeholder:"예: 김에너", value: store.get("name","")});
  P.replaceChildren(el("div",{class:"intro"},
    el("img",{class:"sym",src:SYM,alt:""}),
    el("div",{class:"clock","aria-hidden":"true"},"08",el("span",{class:"dot"}),"40"),
    el("h1",{},"에너닷에서의 첫 하루를 미리 걸어봐요"),
    el("p",{},`출근부터 퇴근까지 ${SCENES.length}개의 순간이 기다려요. 상황마다 어떻게 할지 고르면 바로 정답과 이유를 알려드려요. 7분 정도 걸려요.`),
    el("label",{class:"field",for:"nm"},"이름 (선택)"), name,
    el("button",{class:"btn",onclick(){ store.set("name", name.value.trim()); start(); }},"첫날 시작하기"),
    last ? el("p",{class:"note"},`지난 기록: ${last.score} kWh / ${MAX} kWh`) : null
  ));
}

function start(){ game = {i:0, res:[]}; renderScene(); }

const RUNNER = `<svg viewBox="0 0 24 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g class="arm b"><polyline points="13.4,11 11,15.5 13,18.5" stroke="#00AE77" stroke-width="2.6"/></g>
  <g class="leg b"><polyline points="11,19 12.5,25 10.5,31" stroke="#00AE77" stroke-width="3"/></g>
  <line x1="13.6" y1="10" x2="11" y2="19" stroke="var(--blue)" stroke-width="3.8"/>
  <g class="leg a"><polyline points="11,19 12.5,25 10.5,31" stroke="var(--blue)" stroke-width="3"/></g>
  <g class="arm a"><polyline points="13.4,11 11,15.5 13,18.5" stroke="var(--blue)" stroke-width="2.6"/></g>
  <circle cx="15.6" cy="5" r="3.7" fill="var(--blue)"/>
</svg>`;
const FLAG = `<svg class="flag" style="left:{L}" viewBox="0 0 18 30"><line class="pole" x1="2" y1="1" x2="2" y2="29" stroke-width="1.6" stroke-linecap="round"/><polygon points="2,2 17,2 15,7 2,7" fill="#0975D0"/><polygon points="2,9 15,9 13,14 2,14" fill="#00AE77"/></svg>`;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pos = k => `calc(12px + (100% - 24px) * ${k/SCENES.length})`;
const fillW = k => `calc((100% - 24px) * ${k/SCENES.length})`;

function moveTo(me, fill, k, done){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    me.classList.remove("jump");
    me.classList.add("run");
    me.style.left = pos(k); fill.style.width = fillW(k);
    setTimeout(()=>{ me.classList.remove("run"); if (done) done(); }, REDUCED ? 0 : 650);
  }));
}

function track(){
  const from = game.prev == null ? game.i : game.prev;
  const fill = el("div",{class:"fill",style:`width:${fillW(from)}`});
  const t = el("div",{class:"track","aria-hidden":"true"}, el("div",{class:"line"}), fill);
  SCENES.forEach((_,i)=>{
    const r = game.res[i];
    t.append(el("span",{class:"tick"+(r===true?" ok":r===false?" no":""),style:`left:${pos(i)}`}));
  });
  t.insertAdjacentHTML("beforeend", FLAG.replace("{L}", pos(SCENES.length)));
  const me = el("span",{class:"me",style:`left:${pos(from)}`});
  me.innerHTML = RUNNER;
  t.append(me);
  if (from !== game.i) moveTo(me, fill, game.i);
  game.prev = game.i;
  return t;
}

function renderScene(){
  const s = SCENES[game.i];
  const score = game.res.filter(Boolean).length * PER;
  const choices = el("div",{class:"choices",role:"group","aria-label":"선택지"});
  const fbBox = el("div");
  s.c.forEach((txt, idx)=> choices.append(el("button",{class:"choice",onclick(){ answer(idx, choices, fbBox); }}, txt)));
  P.replaceChildren(
    track(),
    el("div",{class:"meta"}, el("span",{},`${game.i+1} / ${SCENES.length}`), el("span",{class:"kwh"},`${score} kWh`)),
    el("div",{class:"scene"},
      el("div",{class:"when"}, el("span",{class:"t"},s.t), el("span",{class:"p"},s.p)),
      el("p",{class:"q"},s.q), choices, fbBox)
  );
  window.scrollTo({top:0});
}

function answer(idx, choices, fbBox){
  const s = SCENES[game.i], ok = idx === s.a;
  game.res[game.i] = ok;
  [...choices.children].forEach((b,j)=>{
    b.disabled = true;
    if (j === s.a) b.classList.add("right"); else if (j === idx) b.classList.add("wrong"); else b.classList.add("dim");
  });
  const last = game.i === SCENES.length - 1;
  const next = el("button",{class:"btn",onclick(){
    if (!last){ game.i++; renderScene(); return; }
    next.disabled = true;
    window.scrollTo({top:0});
    moveTo(P.querySelector(".track .me"), P.querySelector(".track .fill"), SCENES.length, ()=>setTimeout(finish, REDUCED ? 0 : 400));
  }}, last ? "결승선 통과하기" : "다음 장면으로");
  fbBox.replaceChildren(el("div",{class:"fb "+(ok?"ok":"no")},
    el("strong",{}, ok ? `맞아요! +${PER} kWh` : "이렇게 하면 돼요"),
    el("p",{}, s.w)), next);
  const meta = P.querySelector(".meta .kwh");
  if (meta) meta.textContent = `${game.res.filter(Boolean).length*PER} kWh`;
  const tick = P.querySelectorAll(".tick")[game.i];
  if (tick) tick.classList.add(ok?"ok":"no");
  const me = P.querySelector(".track .me");
  if (ok && me){ me.classList.remove("jump"); void me.offsetWidth; me.classList.add("jump"); }
  next.focus({preventScroll:true});
  fbBox.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest"});
}

function finish(){
  const right = game.res.filter(Boolean).length, score = right * PER, ratio = right / SCENES.length;
  const g = GRADES.find(x => ratio >= x.min);
  store.set("last", {score, at: Date.now()});
  const name = store.get("name","");
  const missed = SCENES.filter((_,i) => !game.res[i]);
  const lit = el("img",{class:"lit",src:SYM,alt:""});
  P.replaceChildren(el("div",{class:"result"},
    el("div",{class:"charge",role:"img","aria-label":`발전량 ${Math.round(ratio*100)}%`}, el("img",{class:"base",src:SYM,alt:""}), lit),
    el("div",{class:"big"}, String(score), el("small",{},"kWh")),
    el("div",{class:"unit"},`오늘의 온보딩 발전량, ${SCENES.length}개 중 ${right}개 정답`),
    el("h2",{}, g.t),
    el("p",{class:"lead"}, (name ? `${name}님, ` : "") + g.d),
    missed.length ? el("div",{class:"review"}, el("h3",{},"다시 보면 좋은 내용"),
      el("ol",{}, missed.map(s => el("li",{}, el("b",{},`${s.t} ${s.p}`), el("p",{}, s.w))))) : null,
    el("button",{class:"btn ghost",onclick: start},"처음부터 다시 하기")
  ));
  window.scrollTo({top:0});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ lit.style.clipPath = `inset(${100 - ratio*100}% 0 0 0)`; }));
}

renderIntro();
})();
</script>
</body>
</html>
